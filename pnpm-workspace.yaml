# Official plugins join the workspace automatically once plugins/<id>/package.json exists.
# templates/* is the copyable starter. It is a real package so CI typechecks it.
packages:
  - 'apps/*'
  - 'packages/*'
  - 'plugins/*'
  - 'templates/*'
  - 'server'

catalog:
  typescript: 6.0.3
  eslint: 10.14.0
  '@eslint/js': 10.0.1
  typescript-eslint: 8.72.1
  eslint-config-prettier: 10.1.8
  prettier: 3.9.10
  vitest: 5.1.0
  vite: 8.3.6
