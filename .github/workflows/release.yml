# 桌面端发布。推送 v* tag（或手动 workflow_dispatch）时打安装包，上传到 draft GitHub Release。
#
# 不在 pull_request 上运行，避免 PR CI 去编译 Rust 或创建 Release。
# PR 检查仍是 .github/workflows/ci.yml。
#
# 矩阵：
#   macOS   universal dmg（arm64 + x64 合成一个包）
#   Windows nsis + msi
#   Linux   AppImage + deb
#
# 签名 secret 都是占位。没配置时不把空值传给 Tauri（空的 APPLE_CERTIFICATE 会让打包失败），
# macOS 改用 ad-hoc identity "-"，Windows / Linux 直接出未签名包。
# 需要的 secret（都不要写进仓库）：
#   TAURI_SIGNING_PRIVATE_KEY
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD
#   APPLE_CERTIFICATE
#   APPLE_CERTIFICATE_PASSWORD
#   APPLE_SIGNING_IDENTITY
#   APPLE_ID
#   APPLE_PASSWORD
#   APPLE_TEAM_ID
#   WINDOWS_CERTIFICATE
#   WINDOWS_CERTIFICATE_PASSWORD
# Updater 公钥以后写在 tauri.conf.json，私钥只放 secret。
# Settings → Actions → General → Workflow permissions 要允许 GITHUB_TOKEN 读写。

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, for example v0.1.0. Must match tauri.conf.json.'
        required: true
        type: string

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macos-universal-dmg
            platform: macos-latest
            args: --target universal-apple-darwin --bundles dmg
          - label: windows-msi-nsis
            platform: windows-latest
            args: --bundles nsis,msi
          - label: linux-appimage-deb
            platform: ubuntu-24.04
            args: --bundles appimage,deb
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve release tag
        id: release_tag
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            tag="$INPUT_TAG"
          else
            tag="$REF_NAME"
          fi
          if ! printf '%s' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$'; then
            echo "::error::Tag 需要是 v1.2.3 或 v1.2.3-rc.1 这种形式，当前是: $tag"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Check tag matches app version
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release_tag.outputs.tag }}
        run: node scripts/check-release-tag.mjs "$RELEASE_TAG"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils
          sudo apt-get install -y libfuse2 || sudo apt-get install -y libfuse2t64 || true
          echo "APPIMAGE_EXTRACT_AND_RUN=1" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm turbo run build --filter=@ai-notes/desktop^...
        env:
          TURBO_TELEMETRY_DISABLED: '1'

      - name: Forward signing secrets when set
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          publish() {
            name="$1"
            value="$2"
            if [ -z "$value" ]; then
              echo "$name is unset"
              return
            fi
            delim="EOF_${name}_$$"
            {
              echo "${name}<<${delim}"
              printf '%s\n' "$value"
              echo "${delim}"
            } >> "$GITHUB_ENV"
            echo "$name is set"
          }
          publish APPLE_CERTIFICATE "$APPLE_CERTIFICATE"
          publish APPLE_CERTIFICATE_PASSWORD "$APPLE_CERTIFICATE_PASSWORD"
          publish APPLE_SIGNING_IDENTITY "$APPLE_SIGNING_IDENTITY"
          publish APPLE_ID "$APPLE_ID"
          publish APPLE_PASSWORD "$APPLE_PASSWORD"
          publish APPLE_TEAM_ID "$APPLE_TEAM_ID"
          publish WINDOWS_CERTIFICATE "$WINDOWS_CERTIFICATE"
          publish WINDOWS_CERTIFICATE_PASSWORD "$WINDOWS_CERTIFICATE_PASSWORD"
          publish TAURI_SIGNING_PRIVATE_KEY "$TAURI_SIGNING_PRIVATE_KEY"
          publish TAURI_SIGNING_PRIVATE_KEY_PASSWORD "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD"

      - name: macOS ad-hoc signing when no certificate is configured
        id: bundle
        shell: bash
        env:
          BASE_ARGS: ${{ matrix.args }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
        run: |
          args="$BASE_ARGS"
          if [ "${{ matrix.platform }}" = "macos-latest" ] && [ -z "$APPLE_CERTIFICATE" ]; then
            node --input-type=module -e 'import { writeFileSync } from "node:fs"; writeFileSync("apps/desktop/src-tauri/ci-macos-adhoc.json", JSON.stringify({ bundle: { macOS: { signingIdentity: "-" } } }, null, 2) + "\n");'
            args="$args --config src-tauri/ci-macos-adhoc.json"
            echo "APPLE_CERTIFICATE is unset; universal dmg will be ad-hoc signed."
          fi
          echo "args=$args" >> "$GITHUB_OUTPUT"

      - name: Import Windows code-signing certificate
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE)) {
            Write-Host "WINDOWS_CERTIFICATE is unset; building MSI/NSIS without Authenticode."
            exit 0
          }
          New-Item -ItemType Directory -Force -Path certificate | Out-Null
          Set-Content -Path certificate/tempCert.txt -Value $env:WINDOWS_CERTIFICATE
          certutil -decode certificate/tempCert.txt certificate/certificate.pfx
          Remove-Item certificate/tempCert.txt
          Import-PfxCertificate -FilePath certificate/certificate.pfx -CertStoreLocation Cert:\CurrentUser\My -Password (ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText)
          Remove-Item -Recurse -Force certificate

      - name: Build and publish draft release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: ${{ steps.release_tag.outputs.tag }}
          releaseName: ai-notes ${{ steps.release_tag.outputs.tag }}
          releaseBody: Draft desktop build for ${{ steps.release_tag.outputs.tag }}. Attached bundles are a universal macOS dmg, Windows NSIS and MSI installers, and Linux AppImage and deb packages.
          releaseDraft: true
          prerelease: false
          args: ${{ steps.bundle.outputs.args }}
