# 桌面端发布流水线。
#
# 触发：推送 v* tag（例如 v0.1.0），或手动 workflow_dispatch 并填写同一个格式的 tag。
# 产物：macOS（Apple Silicon + Intel）、Windows、Linux 安装包，上传到一个 draft GitHub Release。
#
# 现在还不能成功跑完：apps/desktop 只是 TypeScript 占位，没有 Tauri 工程。
# 前端工程师补上 Tauri 2 应用（apps/desktop/src-tauri/tauri.conf.json，以及 package.json
# 里的 "tauri" 脚本）之后，这条流水线才会真正打包。tag 名里的版本要和 tauri.conf.json
# 的 version 对齐（tag v0.1.0 对应 version 0.1.0）。
#
# 签名和自动更新的密钥只放在 GitHub Actions secrets 里，不要写进仓库：
#   TAURI_SIGNING_PRIVATE_KEY
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD
#   APPLE_CERTIFICATE
#   APPLE_CERTIFICATE_PASSWORD
#   APPLE_SIGNING_IDENTITY
#   APPLE_ID
#   APPLE_PASSWORD
#   APPLE_TEAM_ID
#   WINDOWS_CERTIFICATE
#   WINDOWS_CERTIFICATE_PASSWORD
# 公钥写进 apps/desktop/src-tauri/tauri.conf.json 的 updater.pubkey，不要把私钥提交上来。
# 仓库 Settings → Actions → General → Workflow permissions 需要允许 GITHUB_TOKEN 读写，
# 否则创建 Release 会报 Resource not accessible by integration。

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, for example v0.1.0'
        required: true
        type: string

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macos-aarch64
            platform: macos-latest
            args: --target aarch64-apple-darwin
          - label: macos-x64
            platform: macos-latest
            args: --target x86_64-apple-darwin
          - label: linux-x64
            platform: ubuntu-24.04
            args: ''
          - label: windows-x64
            platform: windows-latest
            args: ''
    runs-on: ${{ matrix.platform }}
    env:
      # Tauri updater（minisign）。用 `pnpm tauri signer generate` 在本地生成，只把私钥放进 secrets。
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      # macOS 签名与公证。未配置时打出来的是未签名包；Apple Silicon 从 GitHub 下载未签名包可能被系统标成已损坏。
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      # Windows Authenticode（.pfx 的 base64）。空着就跳过导入。
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve release tag
        id: release_tag
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            tag="$INPUT_TAG"
          else
            tag="$REF_NAME"
          fi
          if ! printf '%s' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$'; then
            echo "::error::Tag 需要是 v1.2.3 或 v1.2.3-rc.1 这种形式，当前是: $tag"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Require the Tauri app
        shell: bash
        run: |
          if [ ! -f apps/desktop/src-tauri/tauri.conf.json ]; then
            echo "::error::apps/desktop 还是 TypeScript 占位，没有 Tauri 应用。前端工程师需要先补上 Tauri 2 + Vite + React（含 src-tauri/tauri.conf.json 和 package.json 的 tauri 脚本），这条发布流水线才能打包。"
            exit 1
          fi

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - name: Import Windows code-signing certificate
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE)) {
            Write-Host "WINDOWS_CERTIFICATE is unset; building without Authenticode."
            exit 0
          }
          New-Item -ItemType Directory -Force -Path certificate | Out-Null
          Set-Content -Path certificate/tempCert.txt -Value $env:WINDOWS_CERTIFICATE
          certutil -decode certificate/tempCert.txt certificate/certificate.pfx
          Remove-Item certificate/tempCert.txt
          Import-PfxCertificate -FilePath certificate/certificate.pfx -CertStoreLocation Cert:\CurrentUser\My -Password (ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText)
          Remove-Item -Recurse -Force certificate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and publish draft release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: ${{ steps.release_tag.outputs.tag }}
          releaseName: ai-notes ${{ steps.release_tag.outputs.tag }}
          releaseBody: Draft desktop build for ${{ steps.release_tag.outputs.tag }}. Bundles for macOS (Apple Silicon and Intel), Windows, and Linux are attached by tauri-action.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
